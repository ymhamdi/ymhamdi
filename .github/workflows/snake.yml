# Turns your contribution grid into a snake game, every night.
# Place at: .github/workflows/snake.yml in the ymhamdi/ymhamdi repo.
# The SVGs are pushed to a separate "output" branch so main stays clean.
name: Generate-Snake

on:
  schedule: # 02:37 UTC == 03:37 Tunis
    - cron: "37 2 * * *"
  workflow_dispatch:
  push: # also runs once right after you commit this file
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#2ea043
            dist/snake-dark.svg?palette=github-dark&color_snake=#7AF79A

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: regenerate snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
